<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 400 400" width="400" height="400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7b61ff"></stop>
      <stop offset="0.5" stop-color="#d26cff"></stop>
      <stop offset="1" stop-color="#ff76a8"></stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Star core -->
  <circle cx="150" cy="150" r="14" fill="url(#g1)" filter="url(#glow)" opacity="0.95"></circle>

  <!-- rays -->
  <g stroke="url(#g1)" stroke-linecap="round" stroke-width="6" filter="url(#glow)">
    <line x1="150" y1="10" x2="150" y2="70"></line>
    <line x1="150" y1="230" x2="150" y2="350"></line>
    <line x1="10" y1="150" x2="70" y2="150"></line>
    <line x1="230" y1="150" x2="350" y2="150"></line>
    <line x1="40" y1="40" x2="90" y2="90"></line>
    <line x1="210" y1="210" x2="300" y2="300"></line>
    <line x1="40" y1="260" x2="90" y2="200"></line>
    <line x1="260" y1="40" x2="200" y2="90"></line>
  </g>

  <!-- thin outer halo -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"></circle>
</svg>
